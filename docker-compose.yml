services:
  postgres:
    image: postgres:16-alpine
    container_name: finguide-postgres
    environment:
      POSTGRES_DB: finguide
      POSTGRES_USER: finguide
      POSTGRES_PASSWORD: finguide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguide -d finguide"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
